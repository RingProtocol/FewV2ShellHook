[profile.default]
src = 'src'
test = 'test'
out = 'out'
libs = ['lib']
solc_version = '0.8.26'
optimizer = true
optimizer_runs = 1
# The Shell Hook ships at 24.4 KB against the 24,576 B EIP-170 ceiling, so the
# deployment target is byte-constrained, not gas-constrained. Lowering the
# optimizer run count and dropping the CBOR metadata hash buys ~102 B of
# headroom without touching the hook's ABI, storage layout or revert reasons.
bytecode_hash = "none"
cbor_metadata = false
via_ir = true
evm_version = 'cancun'
fs_permissions = [{ access = "read", path = "out" }]
remappings = [
    "v4-periphery/=lib/v4-periphery/",
    "@uniswap/v4-core/=lib/v4-core/",
    "permit2/=lib/permit2/",
    "openzeppelin-contracts/=lib/openzeppelin-contracts/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "solmate/=lib/solmate/",
    "forge-std/=lib/forge-std/src/",
]

[profile.default.fuzz]
runs = 10000
seed = "0x1"

[rpc_endpoints]
mainnet = "${ETH_RPC_URL}"
